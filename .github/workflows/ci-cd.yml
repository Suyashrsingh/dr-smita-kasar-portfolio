name: CI/CD Pipeline - Build, Test & Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==============================
  # Job 1: Build & Verify (CI)
  # ==============================
  build-and-verify:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install && cd ..
          cd server && npm install && cd ..

      - name: Build Frontend for Production (Vite)
        run: npm run build

      - name: Verify Backend Server Code
        run: node -e "require('./server/server.js'); console.log('Backend code verified.');"

  # ==============================
  # Job 2: Auto Deploy to Vercel (CD)
  # ==============================
  deploy-vercel:
    name: Deploy to Vercel (CD)
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Action (If Secret Configured)
        if: env.HAS_TOKEN == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Vercel Native Deployment Notification
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "ℹ️  VERCEL_TOKEN secret is not set in GitHub repository."
          echo "✅ Vercel automatically deploys every commit pushed to main via native Git Integration."
